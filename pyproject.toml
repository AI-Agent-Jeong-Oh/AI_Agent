[project]
name = "video-analysis-agent"
version = "0.1.0"
description = "Local desktop prototype for reviewing candidate video segments"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "PySide6-Essentials==6.12.0",
    "PySide6-Addons==6.12.0",
]

[project.scripts]
video-analysis-agent = "video_agent.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="숭재수사대 다연캅 macOS 앱 다운로드">
    <title>숭재수사대 다연캅 다운로드</title>
    <link rel="stylesheet" href="./styles.css">
    <script defer src="./config.js"></script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <p class="eyebrow">macOS 앱</p>
        <h1>숭재수사대 다연캅</h1>
        <p>Mac에서 사용할 앱을 ZIP 파일로 다운로드하세요.</p>
      </header>

      <section class="download" aria-labelledby="download-title">
        <h2 id="download-title">앱 다운로드</h2>
        <p>Apple Silicon Mac용 개발 빌드입니다. ZIP을 푼 뒤 앱을 응용 프로그램 폴더로 옮겨주세요.</p>
        <a id="download-link" class="download-link" aria-disabled="true" tabindex="-1">Mac 앱 다운로드</a>
        <p id="download-status" class="download-status" role="status" aria-live="polite">다운로드 파일을 확인하고 있습니다.</p>
      </section>

      <p class="requirement">로컬 영상 분석에는 별도로 설치한 FFmpeg, Ollama 및 영상 모델이 필요합니다.</p>
    </main>
  </body>
</html>
